services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: dp, POSTGRES_PASSWORD: dp, POSTGRES_DB: dp}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://dp:dp@db:5432/dp
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
